server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            - id: booking-service
              uri: lb://booking-service
              predicates:
                - Path=/user/**,/booking,/booking/**,/bookings,/bookings/**,/api/bookings/**
            - id: hotel-service
              uri: lb://hotel-service
              predicates:
                - Path=/api/hotels/**,/api/rooms/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    initial-instance-info-replication-interval-seconds: 5
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: hotel-booking-dev-secret-key-32b
    issuer: hotel-booking
