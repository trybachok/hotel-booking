app:
  jwt:
    secret: hotel-booking-dev-secret-key-32b
    ttl: 1h
    issuer: hotel-booking

spring:
  datasource:
    url: jdbc:h2:mem:booking;MODE=PostgreSQL
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: always
  cloud:
    discovery:
      enabled: false

eureka:
  client:
    enabled: false

resilience4j:
  retry:
    instances:
      hotel:
        max-attempts: 3
        wait-duration: 1ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.hotelbooking.booking.hotelclient.HotelTransientException
  circuitbreaker:
    instances:
      hotel:
        sliding-window-size: 10
        minimum-number-of-calls: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 1s
        record-exceptions:
          - com.hotelbooking.booking.hotelclient.HotelTransientException
